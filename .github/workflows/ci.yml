name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  install-lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint the code
        run: npm run lint

      # - name: Analyze unused files and dependencies
      #   run: pnpm knip

      - name: Run Prettier check
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git fetch origin "$BASE_REF"
            base="origin/$BASE_REF"
          else
            base="$EVENT_BEFORE"
          fi
          changed_files="$(git diff --name-only --diff-filter=ACMR "$base...HEAD" | grep -E '\.(cjs|mjs|js|jsx|ts|tsx|json|md|mdx|yml|yaml|css|scss|html)$' || true)"
          if [[ -n "$changed_files" ]]; then
            printf '%s\n' "$changed_files" | xargs -r -d '\n' npx prettier --check --
          else
            echo "No changed files need formatting checks."
          fi

      - name: Install browsers
        run: npm run test:browser:install

      - name: Run tests
        run: npm test

      - name: Run component tests (headless Chromium)
        run: npm run test:browser

      - name: Build the project
        run: npm run build
