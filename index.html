<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>CareNest AI — Intelligent Elderly Care & Medication Management Platform</title>
    <meta name="title" content="CareNest AI — Intelligent Elderly Care & Medication Management Platform" />
    <meta
      name="description"
      content="Interconnected healthcare platform designed for seniors and caregivers: passcode-protected access, smart medication schedules, proactive email notifications via Resend, and Google Gemini clinical safety analysis."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://catalyst-hackathon.vercel.app" />
    <meta property="og:title" content="CareNest AI — Elderly Care & Medication Ecosystem" />
    <meta
      property="og:description"
      content="Shared healthcare ecosystem with senior safe mode, passcode-based access, proactive email reminders, and Google Gemini 2.5 Flash drug safety intelligence."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://catalyst-hackathon.vercel.app" />
    <meta property="twitter:title" content="CareNest AI — Elderly Care & Medication Ecosystem" />
    <meta
      property="twitter:description"
      content="Shared healthcare ecosystem with senior safe mode, passcode-based access, proactive email reminders, and Google Gemini 2.5 Flash drug safety intelligence."
    />

    <!-- Professional & Classy Typography (GitHub Open Source / Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/core.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/mono.css" />

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
