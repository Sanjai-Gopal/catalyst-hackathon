<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>CareNest AI — Intelligent Elderly Care & Medication Management Platform</title>
    <meta name="title" content="CareNest AI — Intelligent Elderly Care & Medication Management Platform" />
    <meta
      name="description"
      content="Interconnected healthcare platform designed for seniors and caregivers: passcode-protected access, smart medication schedules, proactive email notifications via Resend, and Google Gemini clinical safety analysis."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://catalyst-hackathon.vercel.app" />
    <meta property="og:title" content="CareNest AI — Elderly Care & Medication Ecosystem" />
    <meta
      property="og:description"
      content="Shared healthcare ecosystem with senior safe mode, passcode-based access, proactive email reminders, and Google Gemini 2.5 Flash drug safety intelligence."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://catalyst-hackathon.vercel.app" />
    <meta property="twitter:title" content="CareNest AI — Elderly Care & Medication Ecosystem" />
    <meta
      property="twitter:description"
      content="Shared healthcare ecosystem with senior safe mode, passcode-based access, proactive email reminders, and Google Gemini 2.5 Flash drug safety intelligence."
    />

    <link rel="canonical" href="https://catalyst-hackathon-lime.vercel.app/" />

    <!-- Schema.org JSON-LD for Agentic AI Browsing & Healthcare WebPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "https://catalyst-hackathon-lime.vercel.app/#app",
          "name": "CareNest AI",
          "applicationCategory": "HealthApplication",
          "operatingSystem": "All modern browsers",
          "url": "https://catalyst-hackathon-lime.vercel.app/",
          "description": "Voice-first elderly care and medication adherence platform connecting seniors, adult children, and doctors.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        },
        {
          "@type": "MedicalWebPage",
          "@id": "https://catalyst-hackathon-lime.vercel.app/#webpage",
          "url": "https://catalyst-hackathon-lime.vercel.app/",
          "name": "CareNest AI — Senior Care & Medication Management Ecosystem",
          "about": [
            {
              "@type": "MedicalCondition",
              "name": "Hypertension"
            },
            {
              "@type": "MedicalCondition",
              "name": "Type 2 Diabetes"
            }
          ]
        }
      ]
    }
    </script>

    <!-- Professional & Classy Typography (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
